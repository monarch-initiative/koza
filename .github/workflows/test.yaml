name: Test Koza

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

env:
  UV_VERSION: "0.7.x"

jobs:
  test-python3-ubuntu-latest:
    name: test py${{ matrix.python-version }}${{ matrix.duckdb && format(' duckdb {0}', matrix.duckdb) || '' }} on linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        duckdb: [""]  # latest
        include:
          # Lowest supported duckdb (pyproject floor), so 1.x compatibility doesn't rot.
          - python-version: "3.12"
            duckdb: "1.4.2"
    env:
      OS: ubuntu

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}

      - name: Install library
        run: make install

      - name: Verify lockfile is up-to-date
        run: |
          uv lock --check

      - name: Run tests
        if: matrix.duckdb == ''
        run: make test

      - name: Run tests against the duckdb floor
        if: matrix.duckdb != ''
        run: uv run --with "duckdb==${{ matrix.duckdb }}" pytest tests
